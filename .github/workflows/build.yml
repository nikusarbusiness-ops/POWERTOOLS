
name: Build PowerTools

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 21 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: PowerTools kompilieren
        run: mvn -B clean package

      - name: JAR bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-1.0.0
          path: target/PowerTools-1.0.0.jar
